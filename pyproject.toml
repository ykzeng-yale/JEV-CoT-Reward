[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-control"
version = "0.1.0"
description = "Outcome-grounded checkpoint intervention experiments"
requires-python = ">=3.12"
dependencies = ["numpy>=2", "scikit-learn>=1.5", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8"]
mlx = ["mlx-lm>=0.30"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
